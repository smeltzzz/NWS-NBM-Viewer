# NWS NBM Viewer — Nginx site for a standard Linux VPS (TLS terminates here or
# on a fronting load balancer).  Mirrors docker/nginx.conf semantics but with
# localhost upstreams and paths that fit a distro nginx layout.
#
# Install:
#   sudo apt-get install -y nginx
#   # optional (adds brotli for text/JSON payloads — WebP stays untouched):
#   sudo apt-get install -y libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   sudo cp deploy/nginx/nbm-viewer.conf /etc/nginx/conf.d/
#   sudo mkdir -p /var/cache/nginx/nbm-tiles /var/cache/nginx/nbm-api
#   sudo nginx -t && sudo systemctl reload nginx
#   # then, to enable brotli on a distro where you installed the modules:
#   sudo cp deploy/nginx/nbm-viewer.brotli.optional.conf /etc/nginx/conf.d/nbm-viewer.brotli-off.conf
#
# NOTE: keep the file name pattern `nbm-viewer*.conf` — this config pulls in
# `nbm-viewer.brotli*.conf` via a glob, which is a no-op when brotli modules
# are not installed (unknown directives would otherwise fail nginx -t).

# ── Edge caches (http context) ───────────────────────────────────────────────
# Tiles: immutable-by-URL ({cycle}/{fhour} in the path), so a day is safe and
# keeps NOAA byte-transfer at ~zero after first paint.  `inactive=72h` mirrors
# the backend's disk retention window.
proxy_cache_path /var/cache/nginx/nbm-tiles levels=1:2 keys_zone=nbm_tiles:32m
    max_size=4g inactive=72h use_temp_path=off;

# Run pointer / catalog JSON: micro-cache only.
proxy_cache_path /var/cache/nginx/nbm-api levels=1:2 keys_zone=nbm_api:8m
    max_size=256m inactive=10m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=nbm_api_rate:16m rate=100r/s;

map $http_x_forwarded_proto $nbm_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Redirect to TLS when you add the 443 server block (certbot et al.).
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 75s;
    server_tokens off;
    client_max_body_size 1m;

    # ── Compression: JSON/GeoJSON/text in. WebP out (pass-through). ────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/geo+json application/manifest+json
               application/javascript text/css text/plain image/svg+xml;
    include /etc/nginx/conf.d/nbm-viewer.brotli*.conf;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options              "SAMEORIGIN" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security    $nbm_hsts always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy      "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org; connect-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org; font-src 'self' data: https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; object-src 'none'" always;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503;

    # ── Tiles: aggressive micro-cache, zero transcoding ─────────────────────
    location ^~ /api/v1/tiles/ {
        limit_req zone=nbm_api_rate burst=600 nodelay;
        gzip off;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 15s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache nbm_tiles;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 204 12h;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_revalidate on;
    }

    # ── Run pointer: short micro-cache (freshness signal must stay live) ────
    location ^~ /api/v1/runs/ {
        limit_req zone=nbm_api_rate burst=400 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 20s;
        proxy_cache nbm_api;
        proxy_cache_valid 200 15s;
        proxy_cache_valid 404 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        # location-level add_header would shadow the server-level security
        # block, so re-include the two that matter most for JSON.
        add_header Cache-Control "public, max-age=10, stale-while-revalidate=30" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Remaining versioned API JSON ────────────────────────────────────────
    location ^~ /api/v1/ {
        limit_req zone=nbm_api_rate burst=400 nodelay;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8" always;
            return 204;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
        proxy_cache nbm_api;
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
    }

    # ── Next.js frontend (serves /, /api/health, /_next/*) ──────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
