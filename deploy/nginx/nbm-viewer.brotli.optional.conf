# Opt-in brotli for the VPS nginx site (http-level directives).
#
# Activate by copying to a name matching the glob in nbm-viewer.conf:
#   sudo cp deploy/nginx/nbm-viewer.brotli.optional.conf /etc/nginx/conf.d/nbm-viewer.brotli.conf
# Requires the brotli dynamic module (Debian Bookworm / Ubuntu 22.04+):
#   sudo apt-get install -y libnginx-mod-http-brotli-filter
# Without the module installed, keep this file OUT of /etc/nginx/conf.d and
# `brotli` remains an unknown directive nginx would refuse to start with.

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_buffers 16 8k;
# (No `brotli_proxied` directive exists in ngx_brotli — proxied
# responses are compressed whenever brotli_types matches; unlike gzip it has
# no per-`Via` gating.)
# image/webp intentionally absent: tiles pass through byte-for-byte.
brotli_types application/json application/geo+json application/manifest+json
             application/javascript text/css text/plain image/svg+xml;
