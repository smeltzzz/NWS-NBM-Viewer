# ═════════════════════════════════════════════════════════════════════════════
# NWS NBM Viewer — production edge gateway (Nginx)
#
# Responsibilities:
#   * HTTP/1.1 keepalive front + back, Gzip AND (module-dependent) Brotli
#     compression for JSON / GeoJSON / JS / CSS payloads — WebP tiles are
#     served verbatim: they are already a compressed image format, and any
#     re-encoding pass would be pure CPU waste ("zero transcoding overhead").
#   * Aggressive micro-caching of the tile endpoints (1 day for 200s): tile
#     URLs embed {cycle}/{fhour}, so a cached tile for a published hour is
#     immutable by construction.  Freshness for users comes from the
#     short-cached /api/v1/runs pointer instead.
#   * Security headers (CSP, X-Frame-Options, HSTS-when-terminated, ...) and
#     same-origin CORS passthrough for the Next.js proxy.
#
# This file replaces /etc/nginx/nginx.conf (main + http + server contexts).
# Brotli is wired in through dynamic-module drop-ins, and is deliberately the
# ONLY place `brotli *` directives appear:
#   * /etc/nginx/modules-enabled/*.conf   → main-ctx  `load_module ...;`
#   * /etc/nginx/conf.d/brotli.conf       → http-ctx  `brotli on; ...`
# Both are shipped by docker/nginx.Dockerfile.  On a stock `nginx` image the
# globs match nothing, the main config still validates (gzip-only), and no
# unknown-directive crash can occur.
# ═════════════════════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    use epoll;
    multi_accept on;
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  edge  '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent rt=$request_time ut=$upstream_response_time '
                      'cache=$upstream_cache_status ua="$http_user_agent"';
    access_log  /dev/stdout  edge;

    # ── Transport tuning for many concurrent small requests ──────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  10000;
    server_tokens       off;
    client_max_body_size 1m;
    reset_timedout_connection on;

    # ── Gzip: JSON / GeoJSON / text — never for already-compressed images ───
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_buffers      16 8k;
    gzip_types
        application/json
        application/geo+json
        application/manifest+json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;
    # image/webp and image/png are deliberately NOT in gzip_types/brotli_types:
    # WebP tiles pass through untouched (no re-compression, no re-chunking).
    gzip_disable "msie6";

    # Extra http-context includes (brotli.conf lives here when the module exists).
    include /etc/nginx/conf.d/*.conf;

    # ── Upstreams ────────────────────────────────────────────────────────────
    upstream nbm_backend {
        server backend:8000;
        keepalive 64;
        keepalive_timeout 75s;
        keepalive_requests 10000;
    }
    upstream nbm_frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Cache zones ──────────────────────────────────────────────────────────
    # Tiles: big, long-lived, immutable-by-URL. 1-day validity, 72h inactive
    # window mirrors the backend's disk retention, size-capped and LRU'd.
    proxy_cache_path /var/cache/nginx/tiles
        levels=1:2
        keys_zone=nbm_tiles:64m
        max_size=4g
        inactive=72h
        use_temp_path=off;

    # API micro-cache: the run pointer + capability documents flip on poller
    # ticks; 10-25 s staleness buys enormous read throughput while keeping the
    # "live" feeling.  Stale-on-error keeps viewers painting during NOAA or
    # backend restarts (graceful degradation at the edge).
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=nbm_api:16m
        max_size=512m
        inactive=10m
        use_temp_path=off;

    # Optional abusive-client dampener (tune to your traffic profile).
    limit_req_zone $binary_remote_addr zone=api:32m rate=100r/s;
    limit_req_status 429;

    # HSTS only when the client actually reached us over TLS (or a TLS
    # terminator forwarded https) — an empty value omits the header.
    map $http_x_forwarded_proto $hsts_value {
        https    "max-age=31536000; includeSubDomains";
        default  "";
    }

    server {
        listen       80;
        server_name  _;

        charset utf-8;

        # ── Security headers (server-level so every location inherits them) ──
        # add_header inherits only when a child location declares NO add_header
        # of its own; the two locations below that do re-include the headers
        # via their own explicit copies.
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header X-XSS-Protection          "0"                                            always;
        add_header Cross-Origin-Opener-Policy "same-origin"                                 always;
        add_header Cross-Origin-Resource-Policy "cross-origin"                              always;
        add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=()" always;
        add_header Strict-Transport-Security $hsts_value                                    always;
        # CSP for the MapLibre + Next.js app:
        #   * scripts/styles inline: Next.js runtime bootstrap + maplibre style injection
        #   * workers via blob: (maplibre GL workers)
        #   * imagery/connections: our own origin (tiles!) + the basemap hosts
        #     configured in frontend/lib/basemaps.ts (OpenFreeMap, Esri, CARTO).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org; connect-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org; font-src 'self' data: https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; object-src 'none'" always;
        # Cache status is genuinely useful for tile ops; on non-proxied
        # responses the variable is empty and nginx omits the header.
        add_header X-Cache-Status $upstream_cache_status always;

        # Strip framework noise
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # ── Shared proxy parameters ──────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_next_upstream   error timeout http_502 http_503;

        # ── NBM tiles: aggressive micro-caching, WebP pass-through ──────────
        location ^~ /api/v1/tiles/ {
            limit_req zone=api burst=600 nodelay;
            proxy_pass http://nbm_backend;
            proxy_read_timeout 15s;

            # Zero transcoding overhead: no gunzip, no image_filter, no
            # recompression — WebP bytes travel S3 → backend → edge → browser.
            # (image/webp is absent from both gzip_types and brotli_types, so
            # even the http-level filters pass these bodies through verbatim.)
            gunzip     off;
            gzip       off;
            proxy_buffering on;
            proxy_buffers 32 8k;

            # Tile URLs are immutable by construction ({cycle}/{element}/
            # {fhour}/{z}/{x}/{y}): cache the *rendered bytes* hard.  Negative
            # answers (hour not posted yet) go stale fast; 5xx is never cached,
            # and stale tiles keep painting through backend/NOAA hiccups.
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache nbm_tiles;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 204 12h;
            proxy_cache_valid 404 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 20s;
            proxy_cache_lock_age 25s;
            proxy_cache_revalidate on;
        }

        # ── Run pointer & catalog metadata: short micro-cache ───────────────
        location ^~ /api/v1/runs/ {
            limit_req zone=api burst=400 nodelay;
            proxy_pass http://nbm_backend;
            proxy_read_timeout 20s;

            proxy_cache nbm_api;
            proxy_cache_valid 200 15s;
            proxy_cache_valid 404 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            # Serve the pointer to browsers for a few seconds only — the UI's
            # freshness signal must not be pinned at the edge for long.
            add_header Cache-Control "public, max-age=10, stale-while-revalidate=30" always;
            add_header X-Frame-Options           "SAMEORIGIN" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── Versioned API JSON: micro-cache + CORS passthrough ──────────────
        # Same-origin browser traffic (Next.js rewrite) never sends preflight;
        # OPTIONS short-circuits here so cross-origin consumers survive even a
        # backend deploy. Actual ACAO on GET/POST comes from FastAPI's CORS
        # middleware (single source of truth: CORS_ORIGINS / CORS_ORIGIN_REGEX)
        # — nginx never duplicates it, preventing the classic
        # "multiple values in one Allow-Origin" rejection.
        location ^~ /api/v1/ {
            limit_req zone=api burst=400 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin    $http_origin always;
                add_header Access-Control-Allow-Methods  "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers  "Accept, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age         86400 always;
                add_header Content-Length                 0;
                add_header Content-Type                   "text/plain; charset=utf-8" always;
                return 204;
            }

            proxy_pass http://nbm_backend;
            proxy_read_timeout 30s;
            # Probabilistic product data / probe results: per-hour cache for
            # the tile-aligned JSON so scrubbing repeats at edge speed.
            proxy_cache nbm_api;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
        }

        # ── Frontend (Next.js standalone server) ────────────────────────────
        location / {
            proxy_pass http://nbm_frontend;
            proxy_read_timeout 60s;
            # HTML & friends: no edge cache (Next sets its own policy).
            proxy_buffering on;
        }

        # Next.js static chunks are content-hashed → cache hard, gzip/brotli
        # applies (JS/CSS types) via the http-level settings.
        location ^~ /_next/static/ {
            proxy_pass http://nbm_frontend;
            proxy_cache nbm_api;
            proxy_cache_valid 200 7d;
            proxy_ignore_headers Set-Cookie;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options           "SAMEORIGIN" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── LB healthcheck ───────────────────────────────────────────────────
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
